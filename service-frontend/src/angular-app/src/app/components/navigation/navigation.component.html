<header class="navigation">
  @if (isMobile()) {
  <div class="hamburger">
    <button
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
    >
      <span class="hamburger-icon">&#9776;</span>
    </button>
  </div>
  } @if (!isMobile() || (isMobile() && !isMenuOpen())) {
  <div class="nav-links">
    <div class="nav-tab">
      <a
        href="/"
        exact-active-class="active-nav-tab"
        >HOME</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/portfolio"
        active-class="active-nav-tab"
        >PORTFOLIO</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/services"
        active-class="active-nav-tab"
        >SERVICES</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/contact"
        active-class="active-nav-tab"
        >CONTACT</a
      >
    </div>
  </div>
  } @else {
  <div class="slide-menu">
    <div class="nav-tab">
      <a
        href="/"
        (click)="toggleMenu()"
        >HOME</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/portfolio"
        (click)="toggleMenu()"
        >PORTFOLIO</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/services"
        (click)="toggleMenu()"
        >SERVICES</a
      >
    </div>
    <div class="nav-tab">
      <a
        href="/contact"
        (click)="toggleMenu()"
        >CONTACT</a
      >
    </div>
  </div>
  }
</header>
