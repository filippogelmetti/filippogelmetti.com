<div class="screenshots-wrapper">
  @for (imagePath of galleryImages(); track imagePath) {
  <div
    class="screenshot-wrapper"
    (click)="openGallery($index)"
  >
    <img
      [src]="imagePath"
      alt="Screenshot {{ $index + 1 }}"
    />
  </div>
  }

  <!-- Gallery Overlay -->
  @if (isGalleryOpen()) {
  <div
    class="gallery-overlay"
    (click)="closeGallery()"
  >
    <!-- Image Wrapper -->
    <div
      class="image-wrapper"
      (click)="$event.stopPropagation()"
    >
      <!-- Close Button (X) positioned over the image -->
      <button
        class="close-button"
        (click)="closeGallery(); $event.stopPropagation()"
      >
        ✖
      </button>

      <!-- Image -->
      <img
        [src]="galleryImage"
        class="gallery-image"
      />

      <!-- Navigation Buttons -->
      @if (currentImageIndex() > 0) {
      <button
        class="nav-button prev"
        (click)="prevImage(); $event.stopPropagation()"
      >
        ❮
      </button>
      } @if (currentImageIndex() < galleryImages().length - 1) {
      <button
        class="nav-button next"
        (click)="nextImage(); $event.stopPropagation()"
      >
        ❯
      </button>
      }
    </div>
  </div>
  }
</div>
